<li class="news-item">
  <time datetime="{{ include.post.date | date: '%Y-%m-%d' }}"><a href="{{ include.post.url | relative_url }}">{{ include.post.date | date: "%A, %B %-d, %Y" }}</a></time>
  {%- if include.post.title and include.post.show_title %}<h3>{{ include.post.title }}</h3>{% endif %}
  {{ include.post.content }}
</li>
