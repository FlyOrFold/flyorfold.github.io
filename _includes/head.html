<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% feed_meta %}
<!-- Browser bar colour: matches the sky header (--sky-top) in each theme. -->
<meta name="theme-color" content="#8ec3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07101c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<script>
  // Before first paint: record the theme in use as data-scheme (boot.js keeps it current).
  document.documentElement.dataset.scheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
</script>
{% include import-map.html %}
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ asset_version }}">
