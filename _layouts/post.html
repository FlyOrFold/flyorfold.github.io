---
layout: default
---
<main class="wrap">
  <p class="small"><a href="{{ '/news.html' | relative_url }}">← All news</a></p>
  <article class="news-item">
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%A, %B %-d, %Y" }}</time>
    <h1 style="font-size:1.4rem">{{ page.title }}</h1>
    {{ content }}
  </article>
</main>
